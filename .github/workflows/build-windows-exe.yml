name: Build Standalone Executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions: {}

jobs:
  build-executables:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: quicksand-windows-x64
            bin_src: dist/quicksand.exe
            release_asset: dist/quicksand.exe
          - os: ubuntu-22.04
            artifact_name: quicksand-linux-x86_64
            bin_src: dist/quicksand
            release_asset: dist/quicksand-linux-x86_64
          - os: macos-latest
            artifact_name: quicksand-macos-arm64
            bin_src: dist/quicksand
            release_asset: dist/quicksand-macos-arm64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies and PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run security and parser test suite
        shell: bash
        run: |
          python tests/test_security.py

      - name: Build standalone executable
        shell: bash
        run: |
          pyinstaller --clean quicksand.spec
          if [ "${{ matrix.bin_src }}" != "${{ matrix.release_asset }}" ]; then
            cp "${{ matrix.bin_src }}" "${{ matrix.release_asset }}"
            chmod +x "${{ matrix.release_asset }}"
          fi

      - name: Smoke-test executable
        shell: bash
        run: |
          "./${{ matrix.release_asset }}" --help
          "./${{ matrix.release_asset }}" --version

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.release_asset }}

      - name: Attach executable to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" --generate-notes || true
          gh release upload "$TAG_NAME" "${{ matrix.release_asset }}" --clobber
